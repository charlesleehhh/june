# 果价雷达配置模板
# 复制为 config.properties 后填写真实值。
# 注意：本文件会被提交到公开仓库，切勿写入真实账号密码；真实配置只放 config.properties（已被 .gitignore 排除）。

# ---- 数据库（另一台服务器上的 MySQL，需放行应用服务器 IP）----
db.url=jdbc:mysql://db-host:3306/radar?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
db.user=radar
db.password=CHANGE_ME

# ---- 输出 ----
# 生成的前端数据文件（写进站点部署目录，workflow 已配 skip-worktree 保护）
output.json=/opt/data/charleslee/github/june/data/prices.json
meta.launchDate=2026-09-18

# ---- 核心数据源：苹果团（服务端渲染，可稳定解析）----
tuan.enabled=true
tuan.url=https://appletuan.com/quotes/1
# 成交记录翻页数（第 2 页起与第 1 页内容重复，程序自动去重）
tuan.orderPages=2
# 是否用成交记录按日回填历史价格（撑起走势图）
tuan.backfill=true

# ---- 网络 ----
http.timeoutMs=10000
http.retries=3
# 服务器出网受限时可走 HTTP 代理（留空表示不用）
http.proxyHost=
http.proxyPort=
# 抓取失败时的页面快照目录，便于诊断
http.dumpDir=/opt/data/charleslee/radar/dump

# ---- 管理员后台（--serve 模式）----
admin.host=127.0.0.1
admin.port=8099
admin.user=charleslee
# 建议设置，作为 nginx Basic Auth 之外的第二层校验
admin.password=

# ---- 京东（接口已封，实测 TLS 握手被拒，保持 false）----
jd.enabled=false
# 若日后接口恢复，把 jd.enabled 打开并填 skuId（商品页 URL 里的数字）
jd.sku.pro-256=
jd.sku.pro-512=
jd.sku.pro-1024=
jd.sku.pro-2048=
jd.sku.max-256=
jd.sku.max-512=
jd.sku.max-1024=
jd.sku.max-2048=
